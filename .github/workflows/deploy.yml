name: Build & Validate RNT School

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-test:
    name: 🔨 Build & Validate Project
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: school_frontend/package-lock.json

      # Backend validation
      - name: 📦 Install Backend Dependencies
        working-directory: ./school_backend
        run: npm ci

      # Frontend build validation
      - name: 📦 Install Frontend Dependencies
        working-directory: ./school_frontend
        run: npm ci

      - name: 🏗️ Build Frontend (Production)
        working-directory: ./school_frontend
        env:
          VITE_API_URL: /api
        run: npm run build

      # Docker build validation
      - name: 🐳 Validate Docker Compose Build
        run: |
          cp .env.example .env
          docker compose build
