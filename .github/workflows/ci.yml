name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  client-test:
    name: Client (React) — test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: school_frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./school_frontend
        run: npm ci

      - name: Build Client (React)
        working-directory: ./school_frontend
        env:
          VITE_API_URL: /api
        run: npm run build

  server-test:
    name: Server (Node/Express) — test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: school_backend/package-lock.json

      - name: Install dependencies
        working-directory: ./school_backend
        run: npm ci

      - name: Validate Server Syntax
        working-directory: ./school_backend
        run: node -c server.js

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [client-test, server-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          cp .env.example .env
          docker compose build
